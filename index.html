<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Julien &amp; Dynasties</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout : registre de guilde — bandeau d'état, onglets, une colonne de travail. Vert bouteille + laiton. */
:root{
  --bg:#e9ece3; --panel:#f6f7f1; --panel2:#eef1e8; --ink:#1c2a23; --muted:#56655c; --line:#c5ccbe;
  --accent:#8f6216; --accent-ink:#fff9ec; --good:#2d6a43; --bad:#a1392b; --warn:#9a6b10; --chip:#dfe4d6;
  --f-display:"IM Fell English SC","Iowan Old Style",Georgia,serif;
  --f-body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111916; --panel:#18221e; --panel2:#1d2924; --ink:#e6e1d1; --muted:#97a398; --line:#2c3a33;
  --accent:#d8a443; --accent-ink:#1b1407; --good:#72c08d; --bad:#e5806f; --warn:#e2b75a; --chip:#23302a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111916; --panel:#18221e; --panel2:#1d2924; --ink:#e6e1d1; --muted:#97a398; --line:#2c3a33;
  --accent:#d8a443; --accent-ink:#1b1407; --good:#72c08d; --bad:#e5806f; --warn:#e2b75a; --chip:#23302a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
#app{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:2.1rem;line-height:1.05}
h2{font-size:1.45rem}
h3{font-size:1.15rem}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:.45em .9em}
button:hover{border-color:var(--accent)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button.danger{color:var(--bad);border-color:var(--bad)}
button:disabled{opacity:.45;cursor:not-allowed}
select,input,textarea{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:.4em .6em}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}
.spread{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.two{display:grid;gap:14px;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}
@media (max-width:760px){.two{grid-template-columns:1fr}}

/* Bandeau */
.top{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:10px}
.brand small{display:block;font-family:var(--f-body);font-size:.8rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--f-mono);font-size:1.05rem;font-variant-numeric:tabular-nums}
.hearts{letter-spacing:2px;color:var(--accent);font-family:var(--f-mono)}
nav.tabs{display:flex;flex-wrap:wrap;gap:4px}
nav.tabs button{border:none;background:transparent;border-bottom:2px solid transparent;border-radius:0;padding:.35em .7em;color:var(--muted);font-weight:500}
nav.tabs button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* Héros */
.hero{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:start;cursor:pointer}
.hero:hover{border-color:var(--accent)}
.hero.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.hero.off{opacity:.55}
.crest{width:44px;height:52px;display:block}
.name{font-weight:700;font-size:1.02rem;line-height:1.2}
.meta{color:var(--muted);font-size:.85rem}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{background:var(--chip);border-radius:4px;padding:1px 7px;font-size:.78rem;white-space:nowrap}
.chip.bad{color:var(--bad)}
.chip.good{color:var(--good)}
.chip.gold{color:var(--accent)}
.bar{height:5px;background:var(--chip);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--good)}
.bar.mor i{background:var(--accent)}
.statline{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-family:var(--f-mono);font-size:.8rem;font-variant-numeric:tabular-nums}
.statline span{background:var(--panel2);border-radius:4px;padding:1px 5px;text-align:center}
.statline span.main{outline:1px solid var(--accent)}

/* Table ligue */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
td.n{text-align:right;font-family:var(--f-mono)}
tr.me td{background:var(--panel2);font-weight:700}
tr.up td:first-child{box-shadow:inset 3px 0 var(--good)}
tr.down td:first-child{box-shadow:inset 3px 0 var(--bad)}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}

/* Descente */
.dungeon{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--panel2)}
.log{height:min(52vh,460px);overflow-y:auto;font-size:.92rem;display:flex;flex-direction:column;gap:2px;padding-right:6px}
.log p{padding:1px 0}
.log .room{font-family:var(--f-display);font-size:1.1rem;margin-top:8px;border-top:1px solid var(--line);padding-top:6px}
.log .head{font-weight:700}
.log .good{color:var(--good)}
.log .bad{color:var(--bad);font-weight:700}
.log .heal{color:var(--good);font-style:italic}
.log .ev{color:var(--accent)}
.log .hit{color:var(--muted)}
.party .p{display:grid;grid-template-columns:32px minmax(0,1fr);gap:8px;align-items:center}
.party .p .crest{width:32px;height:38px}
.party .p.down{opacity:.5}
.score{font-family:var(--f-mono);font-size:2rem;font-variant-numeric:tabular-nums}
.result-win{color:var(--good)} .result-loss{color:var(--bad)} .result-draw{color:var(--warn)}

/* Annales */
.prose{max-width:66ch;display:flex;flex-direction:column;gap:10px}
.prose p{line-height:1.6}
.season-h{font-family:var(--f-display);font-size:1.25rem;border-bottom:1px solid var(--line);padding-bottom:3px}
.memorial{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.tomb{border:1px solid var(--line);border-radius:60px 60px 8px 8px;padding:18px 14px 14px;text-align:center;background:var(--panel2);display:flex;flex-direction:column;align-items:center;gap:6px}
.tomb .ep{font-style:italic;font-size:.92rem}
.news li{padding:6px 0;border-bottom:1px solid var(--line);list-style:none}
.news{padding:0;margin:0}
.news .w{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);margin-right:8px}

/* Modale */
.overlay{position:fixed;inset:0;background:rgba(10,16,13,.55);display:flex;align-items:flex-start;justify-content:center;
  padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow-y:auto;z-index:20}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;max-width:680px;width:100%;display:flex;flex-direction:column;gap:14px}
.title-screen{display:flex;flex-direction:column;gap:18px;max-width:720px}
.title-screen h1{font-size:clamp(2.4rem,7vw,4rem)}
.swatches{display:flex;gap:8px}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);padding:0}
.swatch[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:6px;z-index:30;font-size:.9rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>

const hero=id=>S.heroes.find(h=>h.id===id);
const has=(h,t)=>h.traits.includes(t);
const fem=h=>h.sex==="f";
const available=h=>h&&h.alive!==false&&h.inj===0&&!h.quest;
const ag=(h,m,f)=>fem(h)?f:m;
function news(text,kind=""){S.gazette.unshift({y:S.year,w:S.week,text,kind}); if(S.gazette.length>120)S.gazette.length=120;}
function chron(type,text,heroId){S.log.push({y:S.year,w:S.week,type,text,heroId:heroId||null});}
function mainStat(h){return h.st[CLASSES[h.cls].main];}
function rating(h){return Math.round((h.st.for+h.st.adr+h.st.esp+h.st.vig)*1.2+mainStat(h)*0.8+h.lvl*4+(h.gear.w+h.gear.a)*3);}
function salaryFor(h){return Math.round(5+rating(h)/5);}
function title(h){
  if(h.bossKills>=3)return "Tueur de Seigneurs";
  if(h.descents>=30)return "Vétéran des Lanternes";
  if(h.nearDeaths>=3)return "Increvable";
  if(h.age<=23&&h.lvl>=4)return "Jeune Prodige";
  if(h.kills>=40)return "Fléau des Galeries";
  return "";
}

/* ---------- Création ---------- */
function makeHero(opt={}){
  const sex=opt.sex||(chance(.5)?"f":"m");
  const cls=opt.cls||pick(Object.keys(CLASSES));
  const st={for:ri(5,11),adr:ri(5,11),esp:ri(5,11),vig:ri(5,11)};
  st[CLASSES[cls].main]+=ri(3,6);
  const traits=[];
  if(chance(.04))traits.push("prodige");
  const pool=Object.keys(TRAITS).filter(t=>t!=="prodige");
  while(traits.length<2){const t=pick(pool); if(!traits.includes(t)&&!(t==="robuste"&&traits.includes("fragile"))&&!(t==="fragile"&&traits.includes("robuste")))traits.push(t);}
  let surname=pick(SURN), kin=null;
  if(opt.allowKin&&S.fallen.length&&chance(.12)){const f=pick(S.fallen); surname=f.surname; kin=f.name;}
  const h={id:S.nid++,sex,first:pick(sex==="f"?FN_F:FN_M),surname,cls,st,traits,age:opt.age||ri(18,29),lvl:1,xp:0,
    gear:{w:0,a:0},morale:ri(55,75),inj:0,contract:ri(1,3),sal:0,town:pick(TOWNS),
    kills:0,bossKills:0,descents:0,nearDeaths:0,scars:[],virtues:[],joined:S.year,kin,bench:0,hist:[],alive:true};
  h.name=h.first+" "+h.surname;
  h.sal=salaryFor(h);
  return h;
}
function hist(h,text){h.hist.push(`An ${S.year}, sem. ${S.week+1} : ${text}`); if(h.hist.length>40)h.hist.shift();}

function roundRobin(ids){
  const a=ids.slice(); const n=a.length; const rounds=[];
  for(let r=0;r<n-1;r++){const pairs=[];for(let i=0;i<n/2;i++){const x=a[i],y=a[n-1-i]; pairs.push(r%2?[y,x]:[x,y]);} rounds.push(pairs); a.splice(1,0,a.pop());}
  return rounds.concat(rounds.map(r=>r.map(([x,y])=>[y,x])));
}
function makeSchedules(){S.sched={};for(const d of [1,2,3,4]){S.sched[d]=roundRobin(shuffle(S.guilds.filter(g=>g.div===d).map(g=>g.id)));}}
function resetStandings(){for(const g of S.guilds)g.sp={pl:0,w:0,d:0,l:0,pts:0,sf:0,sa:0,form:[]};}

function genDungeon(div){
  const n=DIVROOMS[div], m=DIVMULT[div];
  const rooms=[];
  for(let r=0;r<n-1;r++){
    if(r===0||chance(.6)){const k=ri(1,div===1?4:3);const foes=[];for(let i=0;i<k;i++)foes.push(pick(MONS).n);rooms.push({type:"combat",foes,k:foes.map(f=>MONS.findIndex(x=>x.n===f))});}
    else rooms.push({type:pick(EVENTS)});
  }
  const b=ri(0,BOSSES.length-1);
  rooms.push({type:"boss",b});
  const cond=chance(.35)?"calme":pick(["gel","brume","eboulis","spores"]);
  return {name:pick(DGA)+" "+pick(DGB),cond,rooms,boss:b,mult:m,div};
}

function genHistory(){
  const champs=[]; const notes=[];
  const strong=S.guilds.filter(g=>!g.isP&&g.div<=2);
  for(let y=1;y<S.year;y++){const g=pick(strong.concat(strong.filter(x=>x.div===1)));g.titles++;champs.push({y,gid:g.id});}
  const T=[
    y=>`Saison ${y} : une crue ferme les citernes de Ribaute ; la Ligue joue ses descentes à sec dans les carrières.`,
    y=>`Saison ${y} : quatre guildes de l'Ardoise font faillite le même hiver. Le Conseil des Lanternes double la prime des mécènes.`,
    y=>`Saison ${y} : la Mine de Hautsauze s'effondre pendant une descente. Onze héros n'en remontent pas.`,
    y=>`Saison ${y} : le Conseil interdit les potions de Brasque après une finale jugée truquée.`,
    y=>`Saison ${y} : premier titre d'une guilde venue de l'Ardoise en moins de quatre ans.`,
    y=>`Saison ${y} : la peste des puits vide les tavernes ; les recrues se font rares et chères.`,
    y=>`Saison ${y} : création de la division Couronne, réservée aux huit meilleures maisons.`
  ];
  const years=shuffle([...Array(S.year-1).keys()].map(i=>i+1)).slice(0,6).sort((a,b)=>a-b);
  years.forEach((y,i)=>notes.push(T[i%T.length](y)));
  S.history={champs,notes};
}

function newGameState(seed){
  S={v:1,rs:seed|0,nid:1,year:31,week:0,gold:600,renown:0,fac:{salle:0,infirm:0},focus:"repos",tactic:"equilibree",
     heroes:[],fallen:[],gone:[],guilds:[],sched:{},gazette:[],annals:[],history:null,log:[],bonds:{},friends:[],tavern:[],
     patron:null,h2h:{},lineup:[],lastReport:null,over:false,nextDg:null,seasonDeaths:[],pending:null,started:S0(),
     cup:null,questOffers:[],market:[],offers:[],ironman:false,townPos:null,mapSeed:0};
  function S0(){return Date.now();}
}
function finalizeGuild(cfg,chosen){
  const used=new Set();
  S.guilds.push({id:0,name:cfg.name,town:cfg.town,hue:cfg.hue,div:4,st:0,isP:true,titles:0,master:null});
  let id=1;
  for(const d of [1,2,3,4]){
    const count=d===4?7:8;
    for(let i=0;i<count;i++){
      let name,town; do{name=pick(GNOUNS);town=pick(TOWNS);}while(used.has(name));
      used.add(name);
      S.guilds.push({id:id++,name:name+" "+deTown(town),town,hue:ri(0,359),div:d,st:DIVSTR[d]+ri(-7,7),isP:false,titles:0,master:null});
    }
  }
  S.heroes=chosen;
  for(const h of chosen){h.joined=S.year;hist(h,`fonde la guilde ${cfg.name}.`);}
  S.lineup=chosen.slice(0,4).map(h=>h.id);
  resetStandings(); makeSchedules(); genHistory();
  S.patron={name:pick(PATRONS),conf:3,target:4,goal:""}; setPatronGoal();
  S.ironman=!!cfg.ironman;
  refreshTavern(true); genMap(); newCup(); refreshQuests(); refreshMarket(true);
  S.nextDg=genDungeon(4);
  news(`${cfg.name} est admise dans la Ligue des Lanternes, division Ardoise. Son mécène : ${S.patron.name}.`,"me");
  chron("found",`La guilde ${cfg.name} est fondée à ${cfg.town} pour la ${S.year}e saison de la Ligue des Lanternes.`);
}
function setPatronGoal(){
  const d=pg().div; const mine=teamStrength();
  const divAvg=S.guilds.filter(g=>g.div===d&&!g.isP).reduce((s,g)=>s+g.st,0)/(d===4?7:7);
  let t,goal;
  if(d===1){t=mine>divAvg+4?1:4; goal=t===1?"Remporter la Lanterne d'Or":"Finir dans les 4 premiers de la Couronne";}
  else if(mine>divAvg+5){t=2;goal=`Monter : finir dans les 2 premiers de l'${d===4?"Ardoise":DIVN[d]}`.replace("l'Bronze","le Bronze").replace("l'Argent","l'Argent");}
  else {t=d===4?4:5; goal=`Finir dans les ${t} premiers`;}
  S.patron.target=t; S.patron.goal=goal;
}
function teamStrength(){
  const r=S.heroes.filter(h=>h.alive).map(rating).sort((a,b)=>b-a).slice(0,4);
  if(!r.length)return 0; return Math.round(r.reduce((a,b)=>a+b,0)/4*0.62);
}
function refreshTavern(full){
  if(full)S.tavern=[];
  else S.tavern=S.tavern.filter(()=>chance(.6));
  while(S.tavern.length<5){const h=makeHero({allowKin:true}); h.fee=h.sal*4+ri(10,40); S.tavern.push(h);}
}

/* ---------- Simulation d'une descente ---------- */
function activeSyn(party){
  const c={}; party.forEach(h=>c[h.cls]=(c[h.cls]||0)+1);
  return SYN.filter(s=>Object.entries(s.need).every(([k,v])=>(c[k]||0)>=v));
}
function combatStats(h){
  const main=mainStat(h);
  let atk=main*0.9+h.gear.w*2.5+h.lvl*1.2;
  let hp=20+h.st.vig*2+h.lvl*3+h.gear.a*5+(h.cls==="rempart"?12:0);
  if(has(h,"robuste"))hp*=1.15; if(has(h,"fragile"))hp*=0.85;
  return {atk,hp:Math.round(hp),arm:h.gear.a*1.5+(h.cls==="rempart"?2:0)};
}
function runDescent(party,tactic,dg){
  const T=[]; const syn=activeSyn(party); const SY=Object.fromEntries(syn.map(s=>[s.id,1]));
  const P=party.map(h=>{const c=combatStats(h);return {h,id:h.id,name:h.first,cls:h.cls,max:c.hp,hp:c.hp,atk:c.atk,arm:c.arm,down:false,fled:false,kills:0,dmg:0,downBy:null,
    drunk:has(h,"ivrogne")?0.85+rnd()*0.3:1};});
  const snap=()=>P.map(p=>[Math.max(0,Math.round(p.hp)),p.max,p.down?1:p.fled?2:0]);
  const say=(text,kind="")=>T.push({text,kind,hp:snap()});
  const res={cleared:0,boss:false,loot:0,retreat:false,wiped:false,deaths:[],injured:[],scarred:[],bossName:BOSSES[dg.boss].n,P,freed:false,altar:false};
  const standing=()=>P.filter(p=>!p.down&&!p.fled);
  let altarBuff=1, anyDown=false;
  const mods=(p)=>{
    let m=p.drunk*altarBuff;
    if(has(p.h,"temeraire"))m*=1.15; if(has(p.h,"couard"))m*=0.9;
    if(has(p.h,"rancunier")&&anyDown)m*=1.25;
    if(dg.cond==="gel"){if(p.cls==="rempart"||p.cls==="fendeur")m*=0.9; if(p.cls==="arcaniste")m*=1.25;}
    if(dg.cond==="brume"&&(p.cls==="archer"||p.cls==="rodeur")&&!has(p.h,"nyctalope"))m*=0.75;
    if(dg.cond==="eboulis"&&has(p.h,"claustro"))m*=0.85;
    if(SY.lame&&p.cls==="fendeur")m*=1.15;
    return m;
  };
  const crit=(p)=>(p.cls==="rodeur"?.25:.07)+(has(p.h,"chanceux")?.05:0)+(SY.oeil?.10:0);
  const onDown=(p,by)=>{
    p.hp=0;p.down=true;p.downBy=by;anyDown=true;
    say(`${p.name} s'effondre sous les coups de ${by} !`,"bad");
    for(const q of standing()){ if(has(q.h,"couard")&&chance(.3)){q.fled=true; say(`${q.name} panique et recule vers la sortie.`,"ev");}}
  };
  function fight(foes,label){
    let round=0;
    while(foes.some(f=>f.hp>0)&&standing().length&&round<30){
      round++;
      for(const p of standing()){
        const live=foes.filter(f=>f.hp>0); if(!live.length)break;
        if(p.cls==="herboriste"){
          const hurt=standing().filter(q=>q.hp<q.max*0.55).sort((a,b)=>a.hp/a.max-b.hp/b.max)[0];
          if(hurt){let amt=Math.round((8+p.h.st.esp*0.7+p.h.lvl)*(SY.source?1.3:1)); hurt.hp=Math.min(hurt.max,hurt.hp+amt); say(`${p.name} panse ${hurt===p?"ses propres plaies":hurt.name} (+${amt}).`,"heal"); continue;}
        }
        const t=pick(live); let d=p.atk*(0.75+rnd()*0.5)*mods(p); let c=false;
        if(rnd()<crit(p)){d*=1.7;c=true;}
        if(t.armor)d-=3;
        d=Math.max(1,Math.round(d)); t.hp-=d; p.dmg+=d;
        if(t.hp<=0){p.kills++; if(t.boss){p.h._bossKill=true;} say(`${p.name} abat ${t.n}${c?" d'un coup terrible":""}.`,"good");}
        else say(`${p.name} ${c?"trouve la faille et ":""}frappe ${t.n} (−${d}).`,"hit");
      }
      for(const f of foes){
        if(f.hp<=0)continue;
        if(f.boss){
          if(f.q==="regen"&&f.hp<f.max){const g=Math.round(f.max*0.05);f.hp=Math.min(f.max,f.hp+g);say(`${cap(f.n)} se reconstitue (+${g}).`,"ev");}
          if(f.q==="enrage"&&!f.enr&&f.hp<f.max/2){f.enr=true;say(`${cap(f.n)} entre en fureur !`,"bad");}
          if(f.q==="summon"&&round%3===0){const base=MONS[ri(0,3)];const mm=dg.mult*1.3;foes.push({n:base.n,hp:Math.round(base.hp*mm),max:Math.round(base.hp*mm),atk:base.atk*mm,g:base.g});say(`${cap(f.n)} fait surgir ${base.n}.`,"ev");}
        }
        const hits=f.boss?2:1;
        for(let i=0;i<hits;i++){
          const tg=standing(); if(!tg.length)break;
          const rem=tg.filter(x=>x.cls==="rempart");
          const t=rem.length&&chance(.55)?pick(rem):pick(tg);
          let d=Math.round(f.atk*(f.enr?1.5:1)*(0.8+rnd()*0.4)-t.arm-(SY.freres&&t.cls==="rempart"?2:0));
          d=Math.max(1,d); t.hp-=d;
          if(t.hp<=0)onDown(t,f.n); else say(`${cap(f.n)} touche ${t.name} (−${d}).`,"hit");
        }
      }
    }
    return !foes.some(f=>f.hp>0);
  }
  const threshold={prudente:1,equilibree:2,agressive:3}[tactic];
  say(`L'expédition descend dans ${dg.name}. Conditions : ${COND[dg.cond].n}.`,"head");
  if(syn.length)say(`Synergie : ${syn.map(s=>s.n).join(", ")}.`,"good");
  for(let r=0;r<dg.rooms.length;r++){
    const room=dg.rooms[r]; const m=dg.mult*(1+0.1*r);
    say(room.type==="boss"?`Salle ${r+1} — l'antre de ${BOSSES[dg.boss].n}`:`Salle ${r+1}`,"room");
    if(room.type==="combat"){
      const foes=room.k.map(i=>{const b=MONS[i];return {n:b.n,hp:Math.round(b.hp*m*1.25),max:Math.round(b.hp*m*1.25),atk:b.atk*m*1.3,g:b.g};});
      say(`Le groupe tombe sur ${foes.map(f=>f.n).join(", ")}.`);
      if(!fight(foes)){res.wiped=true;break;}
      const g=Math.round(foes.reduce((s,f)=>s+f.g,0)*m*0.6*(P.some(p=>has(p.h,"avide")&&!p.down)?1.2:1));
      res.loot+=g; say(`Butin ramassé : ${g} pièces.`,"ev");
    } else if(room.type==="boss"){
      const B=BOSSES[dg.boss]; const bm=m*1.1;
      const f={n:B.n,hp:Math.round(100*bm),max:Math.round(100*bm),atk:10.5*bm,g:40,boss:true,q:B.q,armor:B.q==="armor"};
      say(`${cap(B.n)} se dresse devant eux. ${B.qd}`,"ev");
      if(!fight([f])){res.wiped=true;break;}
      res.boss=true; const g=Math.round(35*dg.mult); res.loot+=g; say(`${cap(B.n)} est vaincu${B.n.startsWith("la ")||B.n.startsWith("Vieille")?"e":""}. Son trésor : ${g} pièces.`,"good");
    } else eventRoom(room.type);
    if(!standing().length){res.wiped=true;break;}
    res.cleared=r+1;
    if(dg.cond==="spores"){for(const p of standing()){if(p.cls==="herboriste"||has(p.h,"devot"))continue; if(ri(1,20)>p.h.st.esp){p.hp-=5; if(p.hp<=0)onDown(p,"les spores"); else say(`${p.name} respire les spores (−5).`,"hit");}}}
    if(dg.cond==="eboulis"&&chance(.5)){const p=pick(standing()); if(p){ if(ri(1,20)>p.h.st.vig){p.hp-=9; if(p.hp<=0)onDown(p,"un éboulement"); else say(`Des pierres tombent sur ${p.name} (−9).`,"hit");} else say(`Des pierres tombent ; ${p.name} les évite.`);}}
    if(!standing().length){res.wiped=true;break;}
    if(room.type==="boss")break;
    const downs=P.filter(p=>p.down).length;
    if(downs>=threshold){res.retreat=true; say(`Trop de blessés : le groupe remonte en portant ses camarades.`,"ev"); break;}
    for(const p of standing())p.hp=Math.min(p.max,p.hp+Math.round(p.max*0.12));
  }
  function eventRoom(t){
    const st=standing(); const find=c=>st.find(p=>p.cls===c); const tr=x=>st.find(p=>has(p.h,x));
    if(t==="coffre"){
      const r=find("rodeur"), a=tr("avide");
      if(r){const g=ri(30,70);res.loot+=g;say(`Un coffre scellé. ${r.name} désamorce le piège et l'ouvre : ${g} pièces.`,"ev");}
      else if(a){const g=ri(20,60);res.loot+=g; if(chance(.5)){a.hp-=8; say(`Un coffre scellé. ${a.name} n'attend personne, l'ouvre et prend une aiguille empoisonnée (−8), mais empoche ${g} pièces.`,"ev"); if(a.hp<=0)onDown(a,"un piège");} else say(`Un coffre scellé. ${a.name} le force sans dommage : ${g} pièces.`,"ev");}
      else say("Un coffre scellé, sans doute piégé. Personne ne sait l'ouvrir ; le groupe passe son chemin.","ev");
    } else if(t==="prisonnier"){
      const k=tr("loyal")||tr("devot");
      if(k){ if(chance(.5)){res.freed=true; say(`Un prisonnier enchaîné supplie. ${k.name} le libère ; il promet de venir s'engager à la taverne.`,"ev");}
        else {say(`Un prisonnier enchaîné supplie. ${k.name} le libère… c'était un appât. Deux brigands surgissent.`,"bad"); const mm=dg.mult; fight([{n:"un brigand renégat",hp:Math.round(22*mm),max:22,atk:6*mm,g:6},{n:"un brigand renégat",hp:Math.round(22*mm),max:22,atk:6*mm,g:6}]);}}
      else say("Un prisonnier enchaîné supplie. Personne n'ose s'en approcher.","ev");
    } else if(t==="autel"){
      const a=find("arcaniste"), m=tr("maudit");
      if(a){altarBuff=1.1;res.altar=true;say(`Un autel fêlé couvert de runes. ${a.name} le déchiffre : le groupe se sent plus fort (+10 % de dégâts).`,"good");}
      if(m){m.hp-=6;m.h.morale=clamp(m.h.morale-6,0,100);say(`L'autel murmure à ${m.name}, qui recule en se tenant la tête (−6).`,"bad"); if(m.hp<=0)onDown(m,"l'autel");}
      if(!a&&!m)say("Un autel fêlé couvert de runes. Personne ne sait les lire.","ev");
    } else if(t==="source"){
      for(const p of st)p.hp=Math.min(p.max,p.hp+Math.round(p.max*0.3));
      const h=find("herboriste"); const d=P.find(p=>p.down);
      if(h&&d){d.down=false;d.hp=Math.round(d.max*0.25);say(`Une source claire. Tout le monde boit, et ${h.name} ranime ${d.name} avec cette eau.`,"good");}
      else say("Une source claire. Le groupe boit et reprend des forces.","heal");
    } else if(t==="champis"){
      const h=find("herboriste"), a=tr("avide");
      if(h){const g=ri(20,45);res.loot+=g;say(`Des champignons luisants. ${h.name} les récolte pour les apothicaires : ${g} pièces.`,"ev");}
      else if(a){a.hp-=7;say(`Des champignons luisants. ${a.name} en goûte un « pour voir » (−7).`,"hit"); if(a.hp<=0)onDown(a,"un champignon");}
      else say("Des champignons luisants. Le groupe les contourne.","ev");
    } else if(t==="piege"){
      const p=pick(st); if(!p)return;
      if(ri(1,20)<=p.h.st.adr)say(`Une dalle s'enfonce sous ${p.name}, qui saute à temps.`,"ev");
      else {p.hp-=10; say(`Une dalle s'enfonce sous ${p.name} : fosse à pieux (−10).`,"bad"); if(p.hp<=0)onDown(p,"une fosse à pieux");}
    }
  }
  // Conséquences pour les héros à terre
  const healer=P.some(p=>p.cls==="herboriste"&&!p.down);
  for(const p of P.filter(p=>p.down)){
    let dc={prudente:.22,equilibree:.32,agressive:.42}[tactic];
    if(has(p.h,"temeraire"))dc+=.05; if(has(p.h,"maudit"))dc+=.1; if(has(p.h,"robuste"))dc-=.1; if(has(p.h,"chanceux"))dc-=.1;
    if(healer)dc-=.15; dc-=S.fac.infirm*.05; if(res.wiped)dc+=.2;
    dc=clamp(dc,.04,.85);
    if(chance(dc))res.deaths.push({id:p.id,by:p.downBy,room:res.cleared+1});
    else {res.injured.push({id:p.id,w:Math.max(1,ri(1,3)-S.fac.infirm)}); if(chance(.4))res.scarred.push(p.id);}
  }
  if(res.wiped)say("Plus personne ne tient debout. Les secours de la Ligue remontent ce qu'ils peuvent.","bad");
  else if(res.boss)say("L'expédition remonte, victorieuse.","good");
  res.score=Math.max(0,res.cleared*10+(res.boss?30:0)+Math.round(res.loot/5)-res.deaths.length*15);
  res.T=T; res.syn=syn;
  return res;
}
const deTown=t=>/^[AEIOUÉÈ]/i.test(t)?"d'"+t:"de "+t;
const aG=n=>n.startsWith("Les ")?"aux "+n.slice(4):n.startsWith("La ")?"à la "+n.slice(3):"à "+n;

const DIVA={1:"la Couronne",2:"l'Argent",3:"le Bronze",4:"l'Ardoise"};
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function maxScore(div){return DIVROOMS[div]*10+30+Math.round(40*DIVMULT[div]/5)+10;}

/* ---------- Semaine ---------- */
function opponentId(){const r=S.sched[pg().div][S.week]; const p=r.find(x=>x.includes(0)); return p[0]===0?p[1]:p[0];}
function record(a,b,sa,sb){
  const A=G(a).sp,B=G(b).sp; A.pl++;B.pl++;A.sf+=sa;A.sa+=sb;B.sf+=sb;B.sa+=sa;
  if(Math.abs(sa-sb)<=2){A.d++;B.d++;A.pts++;B.pts++;A.form.push("N");B.form.push("N");}
  else if(sa>sb){A.w++;B.l++;A.pts+=3;A.form.push("V");B.form.push("D");}
  else {B.w++;A.l++;B.pts+=3;B.form.push("V");A.form.push("D");}
  if(A.form.length>5)A.form.shift(); if(B.form.length>5)B.form.shift();
}
function playWeek(){
  const div=pg().div, dg=S.nextDg, oppId=opponentId(), opp=G(oppId);
  const party=S.lineup.map(hero).filter(available).slice(0,4);
  let res;
  if(!party.length){res={T:[{text:"Aucun héros valide : la guilde déclare forfait.",kind:"bad",hp:[]}],score:0,cleared:0,boss:false,loot:0,deaths:[],injured:[],scarred:[],retreat:false,wiped:false,P:[],syn:[]};}
  else res=runDescent(party,S.tactic,dg);
  const oppScore=aiScore(opp);
  record(0,oppId,res.score,oppScore);
  const out=Math.abs(res.score-oppScore)<=2?"draw":res.score>oppScore?"win":"loss";
  if(out==="loss")S.h2h[oppId]=(S.h2h[oppId]||0)+1;
  const derby=opp.town===pg().town;
  // Autres rencontres
  let upset=null;
  for(const d of [1,2,3,4]){for(const [a,b] of S.sched[d][S.week]){ if(a===0||b===0)continue; const sa=aiScore(G(a)),sb=aiScore(G(b)); record(a,b,sa,sb);
    const gap=G(b).st-G(a).st; if(sa>sb+2&&gap>10&&(!upset||gap>upset.gap))upset={w:a,l:b,gap,d}; if(sb>sa+2&&-gap>10&&(!upset||-gap>upset.gap))upset={w:b,l:a,gap:-gap,d};}}
  if(upset)news(`Surprise en ${DIVN[upset.d]} : ${G(upset.w).name} dominent ${G(upset.l).name}.`);
  let cupRep=null;
  if(S.cup&&S.cup.winner==null&&CUPWEEKS[S.cup.round]===S.week)cupRep=playCupRound(res.score);
  // Conséquences sur les héros
  const rep={week:S.week+1,year:S.year,dg:dg.name,opp:opp.name,oppId,score:res.score,oppScore,out,cleared:res.cleared,rooms:dg.rooms.length,boss:res.boss,bossName:dg.rooms.length?BOSSES[dg.boss].n:"",loot:res.loot,deaths:[],injured:[],scars:[],levels:[],virtues:[],retreat:res.retreat,wiped:res.wiped,income:0,salaries:0,cup:cupRep,derby,quests:[]};
  const partyIds=party.map(h=>h.id);
  const mentor=party.some(h=>has(h,"mentor"));
  for(const p of res.P){
    const h=p.h; h.descents++; h.kills+=p.kills;
    let xp=25+res.cleared*8+(res.boss?25:0); if(mentor&&!has(h,"mentor"))xp*=1.25; if(has(h,"prodige"))xp*=1.5;
    if(!res.deaths.find(d=>d.id===h.id)){h.xp+=Math.round(xp); rep.levels.push(...levelUps(h));}
    if(h._bossKill){delete h._bossKill; h.bossKills++; const v=`Fléau de ${BOSSES[dg.boss].n}`; if(!h.virtues.includes(v)){h.virtues.push(v); rep.virtues.push(`${h.name} : ${v}`); hist(h,`porte le coup fatal à ${BOSSES[dg.boss].n}.`); chron("virtue",`${h.name} abat ${BOSSES[dg.boss].n} dans ${dg.name}.`,h.id);}}
  }
  for(const d of res.deaths){
    const h=hero(d.id); h.alive=false;
    const ep=EPIT[h.traits.find(t=>EPIT[t])]||"La guilde se souvient.";
    const f={id:h.id,name:h.name,surname:h.surname,cls:h.cls,sex:h.sex,born:h.town,joined:h.joined,died:S.year,week:S.week+1,where:dg.name,room:d.room,by:d.by,lvl:h.lvl,kills:h.kills,descents:h.descents,ep,title:title(h),virtues:h.virtues.slice()};
    S.fallen.push(f); S.seasonDeaths.push(h.name); rep.deaths.push(h.name);
    hist(h,`meurt dans ${dg.name}, salle ${d.room}, sous les coups de ${d.by}.`);
    chron("death",`${h.name} (${CLASSES[h.cls].n}) tombe dans ${dg.name}, salle ${d.room}, sous les coups de ${d.by}.`,h.id);
    for(const o of S.heroes.filter(x=>x.alive)){const fr=areFriends(o.id,h.id); o.morale=clamp(o.morale-(fr?22:8),has(o,"loyal")?40:0,100); if(fr)hist(o,`perd ${ag(h,"son ami","son amie")} ${h.name}.`);}
  }
  for(const i of res.injured){const h=hero(i.id); h.inj=i.w; h.nearDeaths++; rep.injured.push(`${h.name} (${i.w} sem.)`); hist(h,`est ramené${ag(h,"","e")} inconscient${ag(h,"","e")} de ${dg.name}.`);}
  for(const id of res.scarred){const h=hero(id); const sc=pick(SCARS.filter(s=>!h.scars.includes(s.n))||SCARS); if(!sc)continue; h.scars.push(sc.n); h.st[sc.s]=Math.max(1,h.st[sc.s]-2); rep.scars.push(`${h.name} : ${sc.n}`); hist(h,`garde une séquelle : ${sc.n}.`); chron("scar",`${h.name} revient de ${dg.name} avec une séquelle : ${sc.n}.`,h.id);}
  S.heroes=S.heroes.filter(h=>h.alive);
  // Liens d'amitié
  for(let i=0;i<partyIds.length;i++)for(let j=i+1;j<partyIds.length;j++){const a=partyIds[i],b=partyIds[j]; if(!hero(a)||!hero(b))continue; const k=a<b?a+"-"+b:b+"-"+a; S.bonds[k]=(S.bonds[k]||0)+1; if(S.bonds[k]===5){S.friends.push(k); const A=hero(a),B=hero(b); news(`${A.name} et ${B.name} sont devenus inséparables.`,"me"); hist(A,`se lie d'amitié avec ${B.name}.`); hist(B,`se lie d'amitié avec ${A.name}.`);}}
  // Moral
  for(const h of S.heroes){
    const inParty=partyIds.includes(h.id); let dm=0;
    if(inParty){dm=out==="win"?6:out==="loss"?-6:1; if(out==="win"&&party.some(x=>has(x,"vantard")&&x.id!==h.id))dm-=2; h.bench=0;}
    else if(available(h)){h.bench++; if(h.bench>2)dm=-3;}
    if(has(h,"devot")&&dm<0)dm=Math.round(dm/2);
    h.morale=clamp(h.morale+dm,has(h,"loyal")?40:0,100);
  }

  if(derby&&out==="win"){S.renown+=3; for(const h of party)h.morale=clamp(h.morale+3,0,100); news(`Derby de ${pg().town} : ${pg().name} règne sur la ville cette semaine.`,"me");}
  if(derby&&out==="loss"){for(const h of party)h.morale=clamp(h.morale-3,0,100);}
  // Entraînement et soins
  for(const h of S.heroes){
    if(h.inj>0){h.inj=Math.max(0,h.inj-(S.focus==="repos"?2:1)); continue;}
    if(h.quest)continue;
    if(S.focus==="repos"){h.morale=clamp(h.morale+3,0,100);continue;}
    const p=.07+S.fac.salle*.04+(h.age<24?.04:0);
    if(chance(p)&&h.st[S.focus]<20){h.st[S.focus]++; hist(h,`gagne +1 en ${STATN[S.focus]} à l'entraînement.`);}
  }
  // Finances
  const income=PATRONPAY[div]+(out==="win"?30:out==="draw"?10:0)+Math.round(res.loot*0.6);
  const sal=S.heroes.reduce((s,h)=>s+h.sal,0);
  S.gold+=income-sal; rep.income=income; rep.salaries=sal;
  S.renown+=out==="win"?3:out==="draw"?1:0; if(res.boss)S.renown+=2;
  if(res.freed){const h=makeHero({}); h.fee=0; S.tavern.unshift(h); news(`L'ancien prisonnier ${h.name} attend à la taverne, prêt à signer gratuitement.`,"me");}
  if(rep.deaths.length)news(`Deuil chez ${pg().name} : ${rep.deaths.join(", ")}.`,"me");
  news(`${pg().name} ${out==="win"?"bat":out==="loss"?"s'incline face à":"fait jeu égal avec"} ${opp.name} (${res.score} – ${oppScore}).`,"me");
  if(S.gold<0)news(`Les coffres de ${pg().name} sont vides. ${S.patron.name} s'inquiète.`,"me");
  tickQuests(rep); tickOffers(); refreshMarket(false); refreshQuests();
  S.lastReport=rep;
  S.week++;
  S.lineup=S.lineup.filter(id=>hero(id));
  refreshTavern(false);
  if(S.week<14)S.nextDg=genDungeon(div);
  save();
  return res;
}
function areFriends(a,b){const k=a<b?a+"-"+b:b+"-"+a; return S.friends.includes(k);}

/* ---------- Fin de saison ---------- */
function sortDiv(d){return S.guilds.filter(g=>g.div===d).sort((a,b)=>b.sp.pts-a.sp.pts||(b.sp.sf-b.sp.sa)-(a.sp.sf-a.sp.sa)||b.sp.sf-a.sp.sf);}
function endSeason(){
  const tables={}; for(const d of [1,2,3,4])tables[d]=sortDiv(d);
  const me=pg(), myDiv=me.div, pos=tables[myDiv].indexOf(me)+1;
  const champ=tables[1][0]; champ.titles++;
  let outcome="stay";
  if(myDiv===1&&pos===1)outcome="title"; else if(myDiv>1&&pos<=2)outcome="promo"; else if(myDiv<4&&pos>=7)outcome="releg";
  news(`${champ.name} remportent la Lanterne d'Or de la ${S.year}e saison.`);
  // Montées / descentes
  for(const d of [2,3,4]){const t=tables[d]; t[0].div=d-1; t[1].div=d-1; news(`${t[0].name} et ${t[1].name} montent en ${DIVN[d-1]}.`);}
  for(const d of [1,2,3]){const t=tables[d]; t[6].div=d+1; t[7].div=d+1;}
  // Mécène
  const ok=pos<=S.patron.target;
  const oldConf=S.patron.conf;
  S.patron.conf=clamp(S.patron.conf+(ok?1:-1)-(S.gold<0?1:0),0,3);
  // Rival
  let rival=null; for(const [id,n] of Object.entries(S.h2h)){if(n>=2&&(!rival||n>rival.n))rival={id:+id,n};}
  // Meilleur héros
  const alive=S.heroes.slice().filter(h=>h.kills>0).sort((a,b)=>b.kills-a.kills||rating(b)-rating(a));
  const best=alive[0];
  const sp=me.sp;
  const A={year:S.year,div:myDiv,pos,outcome,w:sp.w,d:sp.d,l:sp.l,pts:sp.pts,champ:champ.name,deaths:S.seasonDeaths.slice(),best:best?{name:best.name,cls:CLASSES[best.cls].n,kills:best.kills,lvl:best.lvl}:null,
    rival:rival?{name:G(rival.id).name,n:rival.n}:null,goal:S.patron.goal,ok,conf:S.patron.conf,gold:S.gold,
    cup:S.cup?{winner:S.cup.winner!=null?G(S.cup.winner).name:null,mine:S.cup.winner===0,best:S.cup.myBest}:null};
  A.text=seasonProse(A);
  S.annals.push(A);
  chron("season",A.text);
  // Vieillissement, retraites, progression
  const retire=[], decline=[];
  for(const h of S.heroes){
    h.age++;
    if(h.age>32){const s=pick(["vig","adr","for"]); h.st[s]=Math.max(1,h.st[s]-1); decline.push(h.name);}
    else if(h.age<25&&chance(.6+S.fac.salle*.1)){const s=chance(.5)?CLASSES[h.cls].main:pick(Object.keys(h.st)); h.st[s]=Math.min(20,h.st[s]+1);}
    if(h.age>=35&&chance((h.age-34)*.18))retire.push(h);
    h.contract--;
  }
  for(const h of retire){S.heroes=S.heroes.filter(x=>x!==h); S.gone.push({name:h.name,cls:h.cls,why:"retraite",year:S.year,lvl:h.lvl,descents:h.descents}); chron("retire",`${h.name} raccroche après ${h.descents} descentes, à ${h.age} ans.`,h.id); news(`${h.name} prend sa retraite après ${h.descents} descentes.`,"me");}
  for(const h of S.heroes)h.sal=Math.max(h.sal,Math.round(salaryFor(h)*0.9));
  // Anciens héros devenus maîtres de guilde rivale
  for(const g of S.gone.filter(x=>x.to!=null&&!x.master)){ if(chance(.08)){g.master=true; const gg=G(g.to); gg.master=g.name; news(`${g.name}, formé${g.sex==="f"?"e":""} chez ${me.name}, prend la tête de ${gg.name}.`,"me"); chron("master",`${g.name}, ancien de la maison, devient maître de ${gg.name}.`);} }
  // Évolution des guildes adverses
  for(const g of S.guilds){ if(g.isP)continue; g.st=clamp(Math.round(g.st*0.7+DIVSTR[g.div]*0.3+ri(-5,5)),15,92); }
  const contracts=S.heroes.filter(h=>h.contract<=0).map(h=>{let ask=Math.round(salaryFor(h)*(h.morale<30?1.35:h.morale>70?1:1.12)*(has(h,"loyal")?0.85:1)); return {id:h.id,ask,state:"open"};});
  S.pending={stage:"bilan",A,retire:retire.map(h=>h.name),decline,contracts,confLost:S.patron.conf<oldConf};
  if(S.patron.conf<=0){S.over=true; chron("end",`${S.patron.name} retire son soutien. La guilde ${me.name} ferme ses portes après ${S.annals.length} saison${S.annals.length>1?"s":""}.`);}
  save();
}
function seasonProse(A){
  const g=pg().name, dn=DIVN[A.div];
  const open={
    title:[`En la ${A.year}e saison, ${g} a ramené la Lanterne d'Or à ${pg().town}. Peu de monde y croyait en début d'année.`,`La ${A.year}e saison appartient à ${g} : première place de la Couronne et la Lanterne d'Or au-dessus de la porte.`],
    promo:[`La ${A.year}e saison s'achève sur une montée : ${ord(A.pos)} de la division ${dn}, ${g} quitte ${DIVA[A.div]} pour ${DIVA[A.div-1]}.`,`${g} termine ${ord(A.pos)} en ${dn} et gagne sa place en ${DIVN[A.div-1]} pour la ${A.year+1}e saison.`],
    releg:[`La ${A.year}e saison fut amère. Classée ${ord(A.pos)}, la guilde redescend en ${DIVN[A.div+1]}.`,`${ord(A.pos)} place en ${dn} : ${g} n'a pas tenu son rang et descend en ${DIVN[A.div+1]}.`],
    stay:[`${A.year}e saison : une ${ord(A.pos)} place en division ${dn}. Ni gloire, ni honte.`,`${g} boucle la ${A.year}e saison au ${ord(A.pos)} rang de la division ${dn}.`]
  }[A.outcome];
  const parts=[pick(open), `Bilan : ${A.w} victoire${A.w>1?"s":""}, ${A.d} nul${A.d>1?"s":""}, ${A.l} défaite${A.l>1?"s":""}.`];
  if(A.best)parts.push(`${A.best.name}, ${A.best.cls.toLowerCase()} de niveau ${A.best.lvl}, a porté la guilde avec ${A.best.kills} monstre${A.best.kills>1?"s":""} abattu${A.best.kills>1?"s":""} en carrière.`);
  if(A.deaths.length===1)parts.push(`La maison a enterré ${A.deaths[0]}.`);
  else if(A.deaths.length>1)parts.push(`La maison a enterré ${A.deaths.length} des siens : ${A.deaths.join(", ")}.`);
  else parts.push("Aucun héros n'est mort cette année.");
  if(A.rival)parts.push(`${A.rival.name} sont restés la bête noire de la maison, avec ${A.rival.n} victoires sur elle.`);
  parts.push(A.ok?`${S.patron.name.split(",")[0]} jugea l'objectif tenu (« ${A.goal} »).`:`${S.patron.name.split(",")[0]} attendait mieux (« ${A.goal} »).`);
  if(A.outcome!=="title"&&A.champ)parts.push(`La Lanterne d'Or est revenue ${aG(A.champ)}.`);
  if(A.cup){ if(A.cup.mine)parts.push("La guilde a aussi soulevé la Coupe du Solstice.");
    else parts.push(`En Coupe du Solstice, ${A.cup.best===0?"elle est tombée dès les seizièmes":`elle a atteint les ${CUPN[A.cup.best].toLowerCase()}`}${A.cup.winner?` ; le trophée est revenu ${aG(A.cup.winner)}`:""}.`);}
  return parts.join(" ");
}
function startNewSeason(){
  // Contrats non traités = départ
  for(const c of S.pending.contracts){ if(c.state==="open"||c.state==="leave"){const h=hero(c.id); if(h)leaveGuild(h,"fin de contrat");} }
  S.year++; S.week=0; S.seasonDeaths=[]; S.h2h={};
  resetStandings(); makeSchedules(); setPatronGoal();
  refreshTavern(true); S.nextDg=genDungeon(pg().div);
  newCup(); refreshQuests(); refreshMarket(true); S.offers=[];

  news(`La ${S.year}e saison de la Ligue des Lanternes commence. Objectif de ${S.patron.name.split(",")[0]} : ${S.patron.goal}.`,"me");
  S.pending=null; save();
}
function leaveGuild(h,why,toId){
  const to=toId!=null?G(toId):pick(S.guilds.filter(g=>!g.isP));
  S.heroes=S.heroes.filter(x=>x!==h); S.lineup=S.lineup.filter(id=>id!==h.id);

/* ---------- Progression ---------- */
function levelUps(h){
  const out=[];
  while(h.xp>=h.lvl*130){h.xp-=h.lvl*130;h.lvl++; const ms=CLASSES[h.cls].main; h.st[ms]=Math.min(20,h.st[ms]+1); const o=pick(Object.keys(h.st)); h.st[o]=Math.min(20,h.st[o]+1); out.push(`${h.name} passe niveau ${h.lvl}`); hist(h,`atteint le niveau ${h.lvl}.`);}
  return out;
}
function buryHero(h,where,by){
  h.alive=false;
  const ep=EPIT[h.traits.find(t=>EPIT[t])]||"La guilde se souvient.";
  S.fallen.push({id:h.id,name:h.name,surname:h.surname,cls:h.cls,sex:h.sex,born:h.town,joined:h.joined,died:S.year,week:S.week+1,where,room:null,by,lvl:h.lvl,kills:h.kills,descents:h.descents,ep,title:title(h),virtues:h.virtues.slice()});
  S.seasonDeaths.push(h.name);
  S.heroes=S.heroes.filter(x=>x!==h); S.lineup=S.lineup.filter(id=>id!==h.id);
  chron("death",`${h.name} meurt loin de la guilde, dans ${where}.`,h.id);
  for(const o of S.heroes){const fr=areFriends(o.id,h.id); o.morale=clamp(o.morale-(fr?22:8),has(o,"loyal")?40:0,100);}
}

/* ---------- Coupe du Solstice ---------- */
function newCup(){
  const ids=shuffle(S.guilds.map(g=>g.id)); const pairs=[];
  for(let i=0;i<ids.length;i+=2)pairs.push([ids[i],ids[i+1]]);
  S.cup={round:0,pairs,out:false,myBest:0,winner:null,hist:[]};
}
function cupOpp(){const C=S.cup; if(!C||C.out||C.winner!=null)return null; const p=C.pairs.find(x=>x.includes(0)); return p?(p[0]===0?p[1]:p[0]):null;}
function isCupWeek(){return !!S.cup&&S.cup.winner==null&&CUPWEEKS[S.cup.round]===S.week;}
function playCupRound(myScore){
  const C=S.cup; const name=CUPN[C.round]; const next=[]; const lines=[]; let mine=null;
  for(const [a,b] of C.pairs){
    const sa=a===0?myScore:aiScore(G(a)), sb=b===0?myScore:aiScore(G(b));
    const w=sa>sb?a:sb>sa?b:(chance(.5)?a:b);
    next.push(w); lines.push({a,b,sa,sb,w});
    if(a===0||b===0){const opp=a===0?b:a; const won=w===0; mine={round:name,opp:G(opp).name,my:a===0?sa:sb,their:a===0?sb:sa,won};
      if(won){C.myBest=C.round+1; S.gold+=40*(C.round+1); S.renown+=2;} else C.out=true;}
  }
  C.hist.push({name,lines});
  if(mine)news(`Coupe, ${name.toLowerCase()} : ${pg().name} ${mine.won?"élimine":"est éliminée par"} ${mine.opp} (${mine.my} – ${mine.their}).`,"me");
  if(next.length===1){
    C.winner=next[0]; const g=G(next[0]); g.cups=(g.cups||0)+1;
    news(`${g.name} soulève la Coupe du Solstice.`,next[0]===0?"me":"");
    if(next[0]===0){S.gold+=300;S.renown+=15;chron("cup",`${pg().name} remporte la Coupe du Solstice de la ${S.year}e saison.`);}
  } else {
    const sh=shuffle(next.slice()); C.pairs=[]; for(let i=0;i<sh.length;i+=2)C.pairs.push([sh[i],sh[i+1]]);
    C.round++;
  }
  return mine;
}

/* ---------- Quêtes ---------- */
function refreshQuests(){
  S.questOffers=(S.questOffers||[]).filter(()=>chance(.55));
  while(S.questOffers.length<3){
    const q=pick(QTPL), town=pick(TOWNS), danger=ri(1,3), weeks=ri(1,3);
    S.questOffers.push({id:S.nid++,title:q.t(town),cls:q.cls,town,danger,weeks,gold:Math.round((25+danger*30)*weeks*0.8+ri(0,25)),xp:40*weeks+danger*25,renown:danger});
  }
}
function questChance(h,q){return clamp(0.5+(rating(h)-55)/80+(h.cls===q.cls?.15:0)-(q.danger-1)*.12,.1,.95);}
function startQuest(h,q){
  h.quest={...q,left:q.weeks};
  S.questOffers=S.questOffers.filter(x=>x.id!==q.id);
  S.lineup=S.lineup.filter(id=>id!==h.id);
  hist(h,`part : ${q.title}.`);
}
function tickQuests(rep){
  for(const h of S.heroes.slice()){
    if(!h.quest)continue;
    h.quest.left--; if(h.quest.left>0)continue;
    const q=h.quest; h.quest=null;
    if(chance(questChance(h,q))){
      S.gold+=q.gold; S.renown+=q.renown; h.xp+=q.xp; levelUps(h); h.morale=clamp(h.morale+5,0,100);
      hist(h,`réussit : ${q.title} (+${q.gold} or).`);
      const t=`${h.name} revient de quête : ${q.title.charAt(0).toLowerCase()+q.title.slice(1)}. Mission accomplie, ${q.gold} or.`;
      rep&&rep.quests.push(t); news(t,"me");
    } else if(q.danger===3&&chance(.3)){
      buryHero(h,`les environs ${deTown(q.town)}`,"des bandits de grand chemin");
      const t=`${h.name} ne reviendra pas : ${q.title.charAt(0).toLowerCase()+q.title.slice(1)} a mal tourné.`;
      rep&&rep.quests.push(t); rep&&rep.deaths.push(h.name); news(t,"me");
    } else {
      h.inj=ri(1,3); h.morale=clamp(h.morale-4,has(h,"loyal")?40:0,100);
      hist(h,`échoue : ${q.title}, et rentre blessé${ag(h,"","e")}.`);
      const t=`${h.name} rentre bredouille et blessé${ag(h,"","e")} (${h.inj} sem.).`;
      rep&&rep.quests.push(t); news(t,"me");
    }
  }
}

/* ---------- Transferts ---------- */
function marketHero(){
  const h=makeHero({age:ri(21,31)}); const L=ri(2,6);
  for(let i=1;i<L;i++){h.lvl++; const ms=CLASSES[h.cls].main; h.st[ms]=Math.min(20,h.st[ms]+1); const o=pick(Object.keys(h.st)); h.st[o]=Math.min(20,h.st[o]+1);}
  h.gear={w:ri(0,2),a:ri(0,2)}; h.descents=ri(L*3,L*8); h.kills=ri(L*4,L*12);
  h.sal=salaryFor(h); const g=pick(S.guilds.filter(x=>!x.isP)); h.from=g.id;
  h.price=Math.round(rating(h)*6+h.lvl*30);
  return h;
}
function refreshMarket(full){S.market=full?[]:(S.market||[]).filter(()=>chance(.7)); while(S.market.length<4)S.market.push(marketHero());}
function tickOffers(){
  S.offers=(S.offers||[]).filter(o=>o.exp>S.week&&hero(o.hid));
  if(S.heroes.length>4&&chance(.14)){
    const h=pick(S.heroes.slice().sort((a,b)=>rating(b)-rating(a)).slice(0,3));
    if(h&&!S.offers.some(o=>o.hid===h.id)){
      const pool=S.guilds.filter(x=>!x.isP&&x.div<=pg().div); const g=pick(pool.length?pool:S.guilds.filter(x=>!x.isP));
      const o={id:S.nid++,hid:h.id,gid:g.id,price:Math.round(rating(h)*7+h.lvl*40),exp:S.week+3};
      S.offers.push(o); news(`${g.name} proposent ${o.price} or pour ${h.name}.`,"me");
    }
  }
}

/* ---------- Carte ---------- */
function mrng(seed){let a=seed|0;return()=>{a=(a+0x6D2B79F5)|0;let t=a;t=Math.imul(t^(t>>>15),1|t);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
function genMap(){
  S.mapSeed=ri(1,1e9); const r=mrng(S.mapSeed); const pts=[];
  for(const t of TOWNS){let p,k=0; do{p={x:.15+r()*.7,y:.17+r()*.66};k++;}while(k<300&&pts.some(q=>Math.hypot(q.x-p.x,(q.y-p.y)*0.7)<.15)); pts.push(p);}
  S.townPos=pts;
}
function drawMap(){
  const cv=document.getElementById("map"); if(!cv||!cv.getContext)return;
  const w=cv.parentElement.clientWidth, h=Math.round(w*0.66), dpr=window.devicePixelRatio||1;
  cv.width=w*dpr; cv.height=h*dpr; cv.style.width=w+"px"; cv.style.height=h+"px";
  const c=cv.getContext("2d"); c.scale(dpr,dpr);
  const cs=getComputedStyle(document.documentElement); const col=k=>cs.getPropertyValue(k).trim();
  const r=mrng(S.mapSeed);
  c.fillStyle=col("--panel2"); c.fillRect(0,0,w,h);
  c.strokeStyle=col("--line"); c.lineWidth=1;
  for(let y=8;y<h;y+=9){c.beginPath(); for(let x=0;x<=w;x+=12)c.lineTo(x,y+Math.sin(x/18+y)*1.5); c.stroke();}
  const ph=[r()*6,r()*6,r()*6]; const land=[];
  for(let i=0;i<=96;i++){const a=i/96*Math.PI*2; const rad=0.46+0.05*Math.sin(a*3+ph[0])+0.03*Math.sin(a*7+ph[1])+0.015*Math.sin(a*13+ph[2]); land.push([w/2+Math.cos(a)*rad*w,h/2+Math.sin(a)*rad*h]);}
  c.beginPath(); land.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y)); c.closePath();
  c.fillStyle=col("--panel"); c.fill(); c.lineWidth=2; c.strokeStyle=col("--ink"); c.stroke();
  c.save(); c.clip();
  const mx=.25+r()*.5, my=.24+r()*.18;
  c.strokeStyle=col("--muted"); c.lineWidth=1.3;
  for(let i=0;i<16;i++){const x=(mx+(r()-.5)*.34)*w, y=(my+(r()-.5)*.16)*h, s=6+r()*8; c.beginPath(); c.moveTo(x-s,y+s*.6); c.lineTo(x,y-s*.7); c.lineTo(x+s,y+s*.6); c.stroke(); c.beginPath(); c.moveTo(x,y-s*.7); c.lineTo(x+s*.3,y); c.stroke();}
  c.fillStyle=col("--good"); c.globalAlpha=.35;
  const fx0=.2+r()*.6, fy0=.6+r()*.2;
  for(let i=0;i<90;i++){const x=(fx0+(r()-.5)*.36)*w, y=(fy0+(r()-.5)*.2)*h; c.beginPath(); c.arc(x,y,2.2+r()*2.2,0,7); c.fill();}
  c.globalAlpha=1;
  const P=S.townPos.map(p=>({x:p.x*w,y:p.y*h}));
  const rv=P.map((p,i)=>({...p,i})).sort((a,b)=>a.y-b.y).filter((_,i)=>i%3===1);
  c.strokeStyle=col("--accent"); c.globalAlpha=.6; c.lineWidth=2.6; c.beginPath(); c.moveTo(rv[0].x-10,0);
  rv.forEach(p=>c.quadraticCurveTo(p.x+(r()-.5)*40,p.y-22,p.x+14,p.y+6)); c.lineTo(rv[rv.length-1].x+30,h); c.stroke(); c.globalAlpha=1;
  c.restore();
  c.setLineDash([3,4]); c.strokeStyle=col("--muted"); c.lineWidth=1;
  P.forEach((p,i)=>{P.map((q,j)=>({j,d:Math.hypot(q.x-p.x,q.y-p.y)})).filter(o=>o.j!==i).sort((a,b)=>a.d-b.d).slice(0,2).forEach(o=>{if(o.j>i){c.beginPath();c.moveTo(p.x,p.y);c.lineTo(P[o.j].x,P[o.j].y);c.stroke();}});});
  c.setLineDash([]);
  const fs=w<520?11:13; c.textAlign="center";
  TOWNS.forEach((t,i)=>{
    const p=P[i], gs=S.guilds.filter(g=>g.town===t), mine=pg().town===t;
    c.fillStyle=mine?col("--accent"):col("--ink"); c.strokeStyle=col("--panel"); c.lineWidth=2;
    c.beginPath(); c.arc(p.x,p.y,mine?7:3.5+Math.min(4,gs.length),0,7); c.fill(); c.stroke();
    c.font=`700 ${fs}px "Alegreya Sans", system-ui, sans-serif`; c.lineWidth=3; c.strokeStyle=col("--panel");
    c.strokeText(t,p.x,p.y-11); c.fillStyle=col("--ink"); c.fillText(t,p.x,p.y-11);
    if(gs.length){c.font=`${fs-2}px "IBM Plex Mono", monospace`; c.fillStyle=col("--muted"); c.strokeText(gs.length+" g.",p.x,p.y+fs+6); c.fillText(gs.length+" g.",p.x,p.y+fs+6);}
  });
  c.font=`${fs+5}px "IM Fell English SC", Georgia, serif`; c.fillStyle=col("--ink"); c.textAlign="left"; c.fillText("Comté d'Aurmont",14,26);
}

/* ---------- Musique (synthétisée, aucun fichier son) ---------- */
const MUS={ctx:null,on:false,timer:null,nodes:[],step:4};
function toggleMusic(){
  if(MUS.on){MUS.on=false; clearInterval(MUS.timer); MUS.nodes.forEach(n=>{try{n.stop();}catch(e){}}); MUS.nodes=[]; return;}
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC){toast("Ce navigateur ne joue pas de son.");return;}
  const C=MUS.ctx||(MUS.ctx=new AC()); if(C.resume)C.resume();
  const out=C.createGain(); out.gain.value=0.07; out.connect(C.destination); MUS.out=out; MUS.on=true;
  for(const f of [73.42,110]){const o=C.createOscillator(),g=C.createGain(); o.type="sine"; o.frequency.value=f; g.gain.value=0.35; o.connect(g); g.connect(out); o.start(); MUS.nodes.push(o);}
  const scale=[146.83,164.81,174.61,196,220,246.94,261.63,293.66,329.63,349.23,392];
  MUS.timer=setInterval(()=>{
    if(Math.random()<.3)return;
    MUS.step=clamp(MUS.step+[-2,-1,-1,1,1,2][Math.floor(Math.random()*6)],0,scale.length-1);
    const t=C.currentTime, o=C.createOscillator(), g=C.createGain(), lp=C.createBiquadFilter();
    o.type="triangle"; o.frequency.value=scale[MUS.step]; lp.type="lowpass"; lp.frequency.value=1700;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.6,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+1.4);
    o.connect(lp); lp.connect(g); g.connect(MUS.out); o.start(t); o.stop(t+1.5);
  },360);
}

/* ---------- Records ---------- */
function records(){
  const all=[...S.heroes.map(h=>({name:h.name,kills:h.kills,descents:h.descents,lvl:h.lvl,boss:h.bossKills,state:"en activité"})),
             ...S.fallen.map(f=>({name:f.name,kills:f.kills,descents:f.descents,lvl:f.lvl,boss:(f.virtues||[]).length,state:"tombé"})),
             ...S.gone.map(g=>({name:g.name,kills:0,descents:g.descents||0,lvl:g.lvl||1,boss:0,state:g.why}))];
  const best=k=>all.slice().sort((a,b)=>b[k]-a[k])[0];
  return all.length?[["Monstres abattus",best("kills"),"kills"],["Descentes",best("descents"),"descents"],["Niveau",best("lvl"),"lvl"],["Gardiens",best("boss"),"boss"]].filter(r=>r[1]&&r[1][r[2]]>0):[];
}

      ${S.lastReport?reportPanel(S.lastReport,true):""}

}
function reportPanel(r,compact){
  const cls=r.out==="win"?"result-win":r.out==="loss"?"result-loss":"result-draw";
  const word=r.out==="win"?"Victoire":r.out==="loss"?"Défaite":"Nul";
  return `<div class="panel stack"><div class="spread"><h3>${compact?"Dernière descente":"Résultat"}</h3><span class="label">Semaine ${r.week}</span></div>
    <div class="spread"><span class="score ${cls}">${r.score} – ${r.oppScore}</span><b class="${cls}">${word}</b></div>
    <p class="small">${esc(r.dg)} contre ${esc(r.opp)}. Salles franchies : ${r.cleared}/${r.rooms}${r.boss?`, ${r.bossName} abattu`:""}${r.retreat?" (repli)":""}${r.wiped?" (groupe anéanti)":""}.</p>
    <p class="small mono">Recettes +${r.income} · salaires −${r.salaries} · butin ${r.loot}</p>
    ${r.deaths.length?`<p class="small" style="color:var(--bad)"><b>Morts :</b> ${r.deaths.map(esc).join(", ")}</p>`:""}
    ${r.injured.length?`<p class="small"><b>Blessés :</b> ${r.injured.map(esc).join(", ")}</p>`:""}
    ${r.scars.length?`<p class="small"><b>Séquelles :</b> ${r.scars.map(esc).join(", ")}</p>`:""}
    ${r.virtues.length?`<p class="small" style="color:var(--good)"><b>Hauts faits :</b> ${r.virtues.map(esc).join(", ")}</p>`:""}
    ${r.levels.length?`<p class="small"><b>Progrès :</b> ${r.levels.map(esc).join(", ")}</p>`:""}
    ${r.derby?`<p class="small"><span class="chip gold">Derby</span> contre un voisin de ${esc(pg().town)}.</p>`:""}
    ${r.cup?`<p class="small"><b>Coupe, ${r.cup.round.toLowerCase()} :</b> ${r.cup.won?"qualifiée":"éliminée"} contre ${esc(r.cup.opp)} (${r.cup.my} – ${r.cup.their}).</p>`:""}
    ${r.quests&&r.quests.length?`<p class="small"><b>Quêtes :</b> ${r.quests.map(esc).join(" ")}</p>`:""}</div>`;
}

/* ----- Descente ----- */

    return `<div class="panel stack"><h2>La saison est terminée</h2><p>Les quatorze descentes de la ${S.year}e saison sont jouées. Le Conseil des Lanternes publie le classement final, puis viennent les montées, les descentes, les retraites et les contrats.</p><div><button class="primary" data-a="endseason">Clore la saison</button></div></div>`;
  }

  const oppPos=sortDiv(opp.div).indexOf(opp)+1;
  const fit=S.heroes.filter(available);
  S.lineup=S.lineup.filter(id=>available(hero(id)));
  const party=S.lineup.map(hero);
  const syn=activeSyn(party);
  const events=dg.rooms.filter(r=>r.type!=="combat"&&r.type!=="boss").length;
  return `<div class="two">
    <section class="stack">
      <div class="dungeon stack">
        <div class="spread"><div><span class="label">Semaine ${S.week+1} · adversaire</span><h2>${gcrest(opp)}${esc(opp.name)}</h2><p class="small muted">${ord(oppPos)} de la division · forme ${opp.sp.form.join(" ")||"—"}${opp.master?` · maître : ${esc(opp.master)}`:""}</p></div>
        <div class="stack" style="gap:2px;text-align:right"><span class="label">Force estimée</span><b class="mono">${opp.st}</b></div></div>
        ${opp.town===pg().town?`<p class="small"><span class="chip gold">Derby</span> Les deux guildes viennent de ${esc(opp.town)}. Une victoire vaut de la renommée en plus, une défaite pèse sur le moral.</p>`:""}
        ${isCupWeek()&&cupOpp()!=null?`<p class="small"><span class="chip good">Coupe</span> Cette descente compte aussi pour les ${CUPN[S.cup.round].toLowerCase()} de la Coupe du Solstice, contre ${esc(G(cupOpp()).name)}.</p>`:""}
        <hr style="border:none;border-top:1px solid var(--line);width:100%;margin:0">
        <div><span class="label">Lieu de la descente</span><h3>${esc(dg.name)}</h3></div>
        <div class="row"><span class="chip gold">${COND[dg.cond].n}</span><span class="small">${COND[dg.cond].d}</span></div>
        <p class="small">${dg.rooms.length} salles, dont ${events} sans combat prévu. Au fond : <b>${cap(B.n)}</b>. ${B.qd}</p>
        <p class="small muted">Barème : 10 points par salle franchie, 30 pour le gardien, 1 point par 5 pièces de butin, −15 par mort. L'adversaire fait sa propre descente ; le meilleur score l'emporte (écart de 2 ou moins : nul).</p>
      </div>
      <div class="panel stack"><h3>Consignes</h3>
        <div class="row" role="radiogroup" aria-label="Tactique">${[["prudente","Prudente","Remonte dès le 1er héros à terre. Moins de morts."],["equilibree","Équilibrée","Remonte à 2 héros à terre."],["agressive","Agressive","Ne remonte qu'à 3 héros à terre. Plus de morts."]].map(([k,n,d])=>`<button data-a="tactic" data-k="${k}" aria-pressed="${S.tactic===k}" class="${S.tactic===k?"primary":""}" title="${d}">${n}</button>`).join("")}</div>
        <p class="small muted">${{prudente:"Remonte dès le premier héros à terre. Moins de points, moins de morts.",equilibree:"Remonte quand deux héros sont à terre.",agressive:"Ne remonte qu'avec trois héros à terre. Chaque héros à terre risque davantage d'y rester."}[S.tactic]}</p>
        <div><span class="label">Synergies actives</span><div class="chips" style="margin-top:4px">${syn.length?syn.map(s=>`<span class="chip good" title="${esc(s.d)}">${s.n}</span>`).join(""):`<span class="small muted">Aucune avec cette équipe.</span>`}</div></div>
        <div class="row"><button class="primary" data-a="launch" ${party.length?"":"disabled"}>Lancer la descente (${party.length}/4)</button>${party.length?"":`<span class="small" style="color:var(--bad)">Choisissez au moins un héros.</span>`}</div>
      </div>
    </section>
    <section class="stack"><div class="spread"><h2>Expédition</h2><span class="small muted">Touchez un héros pour l'ajouter ou le retirer</span></div>
      ${fit.length?fit.map(h=>heroCard(h,{action:"toggle",sel:S.lineup.includes(h.id)})).join(""):`<p class="panel">Aucun héros valide. Lancer la descente comptera comme un forfait.</p><button data-a="forfeit">Déclarer forfait</button>`}
      ${S.heroes.filter(h=>h.inj>0).length?`<p class="small muted">À l'infirmerie : ${S.heroes.filter(h=>h.inj>0).map(h=>`${esc(h.name)} (${h.inj} sem.)`).join(", ")}</p>`:""}
    </section></div>`;
}
function renderReplay(){
  const R=UI.replay; const T=R.res.T; const i=Math.min(R.i,T.length-1); const cur=T[i];
  const done=R.i>=T.length-1;
  const party=R.res.P.map((p,k)=>{const s=cur.hp[k]||[0,1,0];const pct=Math.round(s[0]/s[1]*100);
    return `<div class="p ${s[2]?"down":""}">${crest(p.h)}<div style="min-width:0"><div class="spread small"><b>${esc(p.h.name)}</b><span class="mono">${s[2]===1?"à terre":s[2]===2?"en fuite":s[0]+"/"+s[1]}</span></div><div class="bar"><i style="width:${pct}%;background:${pct<35?"var(--bad)":"var(--good)"}"></i></div></div></div>`;}).join("");
  return `<div class="two">
    <section class="panel stack"><div class="spread"><h2>${esc(R.dgName)}</h2><div class="row">${done?"":`<button data-a="speed">Vitesse ×${R.speed}</button><button data-a="skip">Aller à la fin</button>`}</div></div>
      <div class="log" id="log" aria-live="polite">${T.slice(0,i+1).map(e=>`<p class="${e.kind}">${esc(e.text)}</p>`).join("")}</div></section>
    <aside class="stack"><div class="panel stack party"><h3>Le groupe</h3>${party||`<p class="muted">Personne n'est descendu.</p>`}</div>
      ${done?reportPanel(S.lastReport,false)+`<button class="primary" data-a="closereplay">Retour à la guilde</button>`:`<p class="small muted">La descente se déroule passe par passe. Le résultat est déjà enregistré.</p>`}</aside></div>`;
}
function scrollLog(){const l=$("#log"); if(l)l.scrollTop=l.scrollHeight;}
function tickReplay(){
  const R=UI.replay; if(!R)return;
  if(R.i<R.res.T.length-1){R.i++; render(); R.timer=setTimeout(tickReplay,[0,420,160,50][R.speed]);}
}

function cupSection(){
  const C=S.cup; if(!C)return "";
  const status=C.winner!=null?`Vainqueur : <b>${esc(G(C.winner).name)}</b>`:`Prochain tour : ${CUPN[C.round].toLowerCase()}, semaine ${CUPWEEKS[C.round]+1}`;
  const me=C.winner===0?"La guilde a remporté la Coupe.":C.out?`Éliminée ${C.myBest===0?"dès les seizièmes":"en "+CUPN[C.myBest].toLowerCase()}.`:C.winner==null?`Toujours en course${cupOpp()!=null?`, prochain adversaire : ${esc(G(cupOpp()).name)}`:""}.`:"";
  return `<div class="panel stack"><div class="spread"><h2>Coupe du Solstice</h2><span class="small">${status}</span></div>
    <p class="small">Les 32 guildes, toutes divisions confondues, à élimination directe. Le score de votre descente de la semaine compte pour le tour de coupe. Chaque tour passé rapporte de l'or ; le vainqueur empoche 300 or et 15 de renommée. <b>${me}</b></p>
    ${C.winner==null?`<div class="tablewrap"><table><thead><tr><th colspan="2">${CUPN[C.round]}</th></tr></thead><tbody>${C.pairs.map(([a,b])=>`<tr class="${a===0||b===0?"me":""}"><td>${gcrest(G(a))}${esc(G(a).name)} <span class="small muted">${DIVN[G(a).div]}</span></td><td>${gcrest(G(b))}${esc(G(b).name)} <span class="small muted">${DIVN[G(b).div]}</span></td></tr>`).join("")}</tbody></table></div>`:""}
    ${C.hist.slice().reverse().map(hh=>`<details><summary>${hh.name}</summary><ul class="news">${hh.lines.map(l=>`<li class="small ${l.a===0||l.b===0?"":"muted"}">${l.w===l.a?"<b>":""}${esc(G(l.a).name)}${l.w===l.a?"</b>":""} <span class="mono">${l.sa} – ${l.sb}</span> ${l.w===l.b?"<b>":""}${esc(G(l.b).name)}${l.w===l.b?"</b>":""}</li>`).join("")}</ul></details>`).join("")}
  </div>`;
}
function vQuetes(){

function chronicleText(){
  const lines=[`ANNALES DE ${pg().name.toUpperCase()}`,""];
  for(const a of S.annals)lines.push(`Saison ${a.year}`,a.text,"");
  if(S.fallen.length){lines.push("MÉMORIAL");for(const f of S.fallen)lines.push(`${f.name}, ${CLASSES[f.cls].n.toLowerCase()} (an ${f.joined} – an ${f.died}). Tombé${f.sex==="f"?"e":""} dans ${f.where}${f.room?", salle "+f.room:""}, sous les coups de ${f.by}. « ${f.ep} »`);}
  return lines.join("\n");
}

        ${H.notes.map(n=>`<p class="small">${esc(n)}</p>`).join("")}
