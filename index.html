      ${records().length?`<div class="panel stack"><h3>Records de la maison</h3>${records().map(([n,r,k])=>`<div class="spread small"><span>${n}</span><span><b>${esc(r.name)}</b> <span class="mono">${r[k]}</span> <span class="muted">(${esc(r.state)})</span></span></div>`).join("")}<div class="spread small"><span>Lanternes d'Or</span><b class="mono">${pg().titles||0}</b></div><div class="spread small"><span>Coupes du Solstice</span><b class="mono">${pg().cups||0}</b></div></div>`:""}
      <h2>Mémorial</h2>
      ${S.fallen.length?`<div class="memorial">${S.fallen.slice().reverse().map(f=>`<div class="tomb">${crest(f)}<b>${esc(f.name)}</b><span class="small muted">${CLASSES[f.cls].n} · niv. ${f.lvl} · an ${f.joined} – an ${f.died}</span>${f.title?`<span class="chip">${f.title}</span>`:""}<span class="small">Tombé${f.sex==="f"?"e":""} dans ${esc(f.where)}${f.room?", salle "+f.room:""}, sous les coups de ${esc(f.by)}.</span><span class="ep">« ${esc(f.ep)} »</span></div>`).join("")}</div>`:`<p class="muted">Aucune tombe pour l'instant.</p>`}
      ${S.gone.length?`<h3>Partis</h3><ul class="news">${S.gone.slice().reverse().map(g=>`<li class="small">${esc(g.name)} · ${g.why}, an ${g.year}${g.to!=null?` · aujourd'hui chez ${esc(G(g.to).name)}`:""}${g.master?" (maître de guilde)":""}</li>`).join("")}</ul>`:""}
    </aside></div>`;
}
function vGazette(){
  return `<section class="stack"><h2>La Gazette des Lanternes</h2><ul class="news panel">${S.gazette.map(n=>`<li><span class="w">S${n.y}·${n.w+1}</span>${n.kind==="me"?"<b>":""}${esc(n.text)}${n.kind==="me"?"</b>":""}</li>`).join("")}</ul></section>`;
}
function vCodex(){
  return `<section class="stack"><h2>Codex</h2><p class="muted">Ces fiches sont tirées des mêmes tables que la simulation.</p>
    <div class="grid">
      <div class="panel stack"><h3>Classes</h3>${Object.values(CLASSES).map(c=>`<p class="small"><b>${c.n}</b> (${STATN[c.main]}) : ${c.d}</p>`).join("")}</div>
      <div class="panel stack"><h3>Conditions</h3>${Object.values(COND).map(c=>`<p class="small"><b>${c.n}</b> : ${c.d}</p>`).join("")}</div>
      <div class="panel stack"><h3>Synergies</h3>${SYN.map(s=>`<p class="small"><b>${s.n}</b> (${Object.entries(s.need).map(([k,v])=>(v>1?v+" × ":"")+CLASSES[k].n).join(" + ")}) : ${s.d}</p>`).join("")}</div>
      <div class="panel stack"><h3>Traits</h3>${Object.values(TRAITS).map(t=>`<p class="small"><b>${t.n}</b> : ${t.d}</p>`).join("")}</div>
      <div class="panel stack"><h3>Gardiens</h3>${BOSSES.map(b=>`<p class="small"><b>${cap(b.n)}</b> : ${b.qd}</p>`).join("")}</div>
      <div class="panel stack"><h3>Hors des donjons</h3><p class="small"><b>Coupe du Solstice</b> : 32 guildes, élimination directe, 5 tours joués aux semaines ${CUPWEEKS.map(w=>w+1).join(", ")}. Votre descente de la semaine fait office de match de coupe.</p><p class="small"><b>Quêtes</b> : 1 à 3 semaines loin de la guilde contre de l'or, de l'expérience et de la renommée. Les plus dangereuses peuvent tuer.</p><p class="small"><b>Transferts</b> : achetez des héros aguerris, ou vendez les vôtres quand une offre arrive.</p><p class="small"><b>Derby</b> : contre une guilde de votre ville, la victoire rapporte plus de renommée et la défaite pèse sur le moral.</p><p class="small"><b>Ironman</b> : aucun chargement de sauvegarde possible.</p></div>
      <div class="panel stack"><h3>Salles sans combat</h3><p class="small"><b>Coffre scellé</b> : un Rôdeur l'ouvre sans risque, un Avide le force.</p><p class="small"><b>Prisonnier</b> : un Loyal ou un Dévot le libère ; parfois un piège.</p><p class="small"><b>Autel</b> : un Arcaniste en tire +10 % de dégâts ; il ronge les Maudits.</p><p class="small"><b>Source</b> : soigne, et l'Herboriste peut y ranimer un héros à terre.</p><p class="small"><b>Champignons</b> : l'Herboriste les vend.</p><p class="small"><b>Fosse</b> : test d'Adresse.</p></div>
    </div></section>`;
}
function vOptions(){
  return `<section class="stack" style="max-width:720px"><h2>Options</h2>
    <div class="panel stack"><h3>Sauvegarde</h3><p class="small muted">La partie est enregistrée automatiquement dans ce navigateur après chaque action. Le code ci-dessous permet de la transférer sur un autre appareil.</p>
      <div class="row"><button data-a="export">Copier le code de sauvegarde</button></div>
      ${S.ironman?`<p class="small"><span class="chip gold">Ironman</span> Le chargement d'une sauvegarde est désactivé pour cette guilde.</p>`:`<label class="label" for="imp">Importer un code</label><textarea id="imp" rows="3" placeholder="Collez un code de sauvegarde"></textarea><div><button data-a="import">Charger ce code</button></div>`}</div>
    <div class="panel stack"><h3>Recommencer</h3><p class="small muted">Efface la guilde actuelle de ce navigateur.</p><div><button class="danger" data-a="askreset">Nouvelle partie</button></div></div>
    <div class="panel stack"><h3>Thème</h3><div class="row">${[["","Système"],["light","Clair"],["dark","Sombre"]].map(([k,n])=>`<button data-a="theme" data-k="${k}">${n}</button>`).join("")}</div></div>
  </section>`;
}
function vOver(){
  return `<div class="panel stack"><h2>${esc(S.patron.name.split(",")[0])} retire son soutien</h2><p>Sans mécène, ${esc(pg().name)} ne peut plus payer ses héros. La guilde ferme ses portes après ${S.annals.length} saison${S.annals.length>1?"s":""}. Ses Annales restent consultables.</p><div class="row"><button data-a="tab" data-t="annales">Lire les Annales</button><button class="primary" data-a="askreset">Fonder une nouvelle guilde</button></div></div>`;
}

/* ----- Modales ----- */
function renderModal(){
  const root=$("#modal-root"); const m=UI.modal;
  if(!m){root.innerHTML="";return;}
  let inner="";
  if(m.type==="hero"){
    const h=hero(m.id)||S.tavern.find(x=>x.id===m.id)||S.market.find(x=>x.id===m.id); if(!h){UI.modal=null;root.innerHTML="";return;}
    const inT=!hero(m.id);
    const c=combatStats(h);
    const fr=S.friends.map(k=>k.split("-").map(Number)).filter(p=>p.includes(h.id)).map(p=>hero(p[0]===h.id?p[1]:p[0])).filter(Boolean);
    inner=`<div class="spread"><div class="row">${crest(h)}<div><h2>${esc(h.name)}</h2><p class="muted">${CLASSES[h.cls].n} · ${h.age} ans · ${ag(h,"né","née")} à ${h.town}${title(h)?` · <i>${title(h)}</i>`:""}</p></div></div><button data-a="closemodal">Fermer</button></div>
      <div class="statline" style="font-size:.9rem">${Object.keys(STATN).map(k=>`<span class="${k===CLASSES[h.cls].main?"main":""}">${STATN[k]} ${h.st[k]}</span>`).join("")}</div>
      <p class="small mono">PV ${c.hp} · attaque ${c.atk.toFixed(1)} · protection ${c.arm.toFixed(1)} · niveau ${h.lvl} (${h.xp}/${h.lvl*130} XP)</p>
      <div class="stack" style="gap:4px">${h.traits.map(t=>`<p class="small"><b>${TRAITS[t].n}</b> : ${TRAITS[t].d}</p>`).join("")}</div>
      ${h.scars.length?`<p class="small" style="color:var(--bad)"><b>Séquelles :</b> ${h.scars.join(", ")}</p>`:""}
      ${h.virtues.length?`<p class="small" style="color:var(--good)"><b>Hauts faits :</b> ${h.virtues.map(esc).join(", ")}</p>`:""}
      ${fr.length?`<p class="small"><b>Amis :</b> ${fr.map(x=>esc(x.name)).join(", ")}</p>`:""}
      ${h.kin?`<p class="small" style="color:var(--accent)">${ag(h,"Parent","Parente")} de ${esc(h.kin)}, tombé au service de la guilde.</p>`:""}
      <p class="small mono">${h.descents} descentes · ${h.kills} monstres · ${h.bossKills} gardiens · moral ${h.morale}/100 · ${inT?`salaire demandé ${h.sal}`:`contrat ${h.contract} an(s), ${h.sal} or/sem.`}</p>
      ${h.hist.length?`<div class="stack" style="gap:2px"><span class="label">Parcours</span>${h.hist.slice().reverse().map(x=>`<p class="small">${esc(x)}</p>`).join("")}</div>`:""}
      ${inT?"":`<div class="row">${m.confirm?`<span class="small">Le renvoyer coûte ${h.sal*2} or d'indemnités.</span><button class="danger" data-a="release" data-id="${h.id}">Confirmer le renvoi</button><button data-a="hero" data-id="${h.id}">Annuler</button>`:`<button class="danger" data-a="askrelease" data-id="${h.id}">Renvoyer</button>`}</div>`}`;
  } else if(m.type==="reset"){
    inner=`<h2>Effacer la partie ?</h2><p>La guilde ${esc(pg().name)}, ses héros et ses Annales seront supprimés de ce navigateur. Copiez votre code de sauvegarde avant si vous voulez la garder.</p><div class="row"><button class="danger" data-a="doreset">Effacer et recommencer</button><button data-a="closemodal">Annuler</button></div>`;
  } else if(m.type==="season"){
    const P=S.pending;
    if(P.stage==="bilan"){
      const A=P.A;
      inner=`<span class="label">Fin de la ${A.year}e saison</span><h2>${A.outcome==="title"?"La Lanterne d'Or !":A.outcome==="promo"?"Montée en "+DIVN[A.div-1]:A.outcome==="releg"?"Descente en "+DIVN[A.div+1]:A.pos+"e place en "+DIVN[A.div]}</h2>
        <p style="line-height:1.6">${esc(A.text)}</p>
        <p class="small">Confiance du mécène : <b class="hearts">${"◆".repeat(A.conf)}${"◇".repeat(3-A.conf)}</b>${S.gold<0?" (les coffres vides lui ont coûté un cran de plus)":""}</p>
        ${P.retire.length?`<p class="small"><b>Retraites :</b> ${P.retire.map(esc).join(", ")}</p>`:""}
        ${P.decline.length?`<p class="small muted">Le temps pèse sur ${P.decline.map(esc).join(", ")}.</p>`:""}
        <div class="row">${S.over?`<button class="primary" data-a="closemodal">Voir la fin</button>`:`<button class="primary" data-a="stage" data-s="contrats">${P.contracts.length?"Contrats à renouveler":"Saison suivante"}</button>`}</div>`;
    } else {
      inner=`<h2>Contrats en fin de course</h2>${P.contracts.length?`<p class="small muted">Sans accord, le héros part chez un rival. Une négociation peut faire baisser le prix… ou le vexer.</p>`:`<p>Aucun contrat à renouveler cette année.</p>`}
        <div class="stack">${P.contracts.map(c=>{const h=hero(c.id); if(!h)return ""; return `<div class="panel spread"><div><b>${esc(h.name)}</b> <span class="small muted">${CLASSES[h.cls].n}, ${h.age} ans, moral ${h.morale}</span><p class="small">Demande <b class="mono">${c.ask}</b> or/semaine pour 2 ans (actuel : ${h.sal}).</p></div>
          <div class="row">${c.state==="open"?`<button class="primary" data-a="ct" data-id="${c.id}" data-k="ok">Accepter</button><button data-a="ct" data-id="${c.id}" data-k="neg">Négocier</button><button class="danger" data-a="ct" data-id="${c.id}" data-k="leave">Laisser partir</button>`:`<span class="chip ${c.state==="signed"?"good":"bad"}">${c.state==="signed"?"Signé":"Part"}</span>`}</div></div>`;}).join("")}</div>
        <div class="row"><button class="primary" data-a="newseason">Commencer la saison ${S.year+1}</button>${P.contracts.some(c=>c.state==="open")?`<span class="small muted">Les contrats non traités ne seront pas renouvelés.</span>`:""}</div>`;
    }
  }
  root.innerHTML=`<div class="overlay" data-a="${m.type==="season"?"":"closemodal"}" data-self="1"><div class="modal" role="dialog" aria-modal="true">${inner}</div></div>`;
}

/* ----- Actions ----- */
const A={
  tab:d=>{UI.tab=d.t;UI.modal=null;},
  continue:()=>{S=load(); ensure(); UI.setup=null; UI.tab=S.week>=14?"descente":"guilde"; if(S.pending){UI.modal={type:"season"};}},
  setup1:()=>{UI.setup={step:1,name:"La Maison Julien",town:"Brasque",hue:48,seed:String(Math.floor(Math.random()*1e6))};},
  back0:()=>{UI.setup={step:0};},
  hue:d=>{readSetup();UI.setup.hue=+d.h;},
  setup2:()=>{readSetup(); const st=UI.setup; if(!st.name.trim()){toast("Donnez un nom à la guilde.");return;}
    newGameState(parseInt(st.seed,10)||12345);
    const cls=shuffle(["rempart","fendeur","archer","arcaniste","herboriste","rodeur","herboriste","fendeur"]);
    st.cands=cls.map(c=>{const h=makeHero({cls:c}); h.town=st.town; return h;}); st.step=2; UI.sel=[];},
  pickfounder:d=>{const id=+d.id; if(UI.sel.includes(id))UI.sel=UI.sel.filter(x=>x!==id); else if(UI.sel.length<5)UI.sel.push(id); else toast("Cinq fondateurs maximum.");},
  found:()=>{const st=UI.setup; const chosen=st.cands.filter(h=>UI.sel.includes(h.id)); finalizeGuild({name:st.name.trim(),town:st.town,hue:st.hue,ironman:st.iron},chosen); UI.setup=null; UI.tab="guilde"; save();},
  hero:d=>{UI.modal={type:"hero",id:+d.id};},
  heroT:d=>{UI.modal={type:"hero",id:+d.id};},
  closemodal:()=>{UI.modal=null;},
  askrelease:d=>{UI.modal={type:"hero",id:+d.id,confirm:true};},
  release:d=>{const h=hero(+d.id); S.gold-=h.sal*2; leaveGuild(h,"renvoi"); UI.modal=null; save(); toast(`${h.name} a quitté la guilde.`);},
  toggle:d=>{const id=+d.id; if(S.lineup.includes(id))S.lineup=S.lineup.filter(x=>x!==id); else if(S.lineup.length<4)S.lineup.push(id); else toast("Quatre héros maximum par descente."); save();},
  tactic:d=>{S.tactic=d.k; save();},
  launch:()=>{const dgName=S.nextDg.name; const res=playWeek(); UI.replay={res,i:0,speed:1,dgName}; render(); UI.replay.timer=setTimeout(tickReplay,400); return "norender";},
  forfeit:()=>{S.lineup=[]; return A.launch();},
  speed:()=>{const R=UI.replay; R.speed=R.speed===3?1:R.speed+1;},
  skip:()=>{const R=UI.replay; clearTimeout(R.timer); R.i=R.res.T.length-1;},
  closereplay:()=>{clearTimeout(UI.replay.timer); UI.replay=null; UI.tab=S.week>=14?"descente":"guilde";},
  div:d=>{UI.div=+d.d;},
  recruit:d=>{const i=S.tavern.findIndex(h=>h.id===+d.id); const h=S.tavern[i]; if(S.gold<h.fee||S.heroes.length>=10)return; S.gold-=h.fee; S.tavern.splice(i,1); h.joined=S.year; h.contract=Math.max(h.contract,1); delete h.fee; S.heroes.push(h); hist(h,`signe avec ${pg().name}.`); chron("join",`${h.name} rejoint la guilde${h.kin?`, sur les traces de ${h.kin}`:""}.`,h.id); news(`${h.name} (${CLASSES[h.cls].n}) signe chez ${pg().name}.`,"me"); if(S.lineup.length<4)S.lineup.push(h.id); save(); toast(`${h.name} rejoint la guilde.`);},
  gear:d=>{const h=hero(+d.id); const k=d.k; const c=GEARCOST[h.gear[k]+1]; if(S.gold<c)return; S.gold-=c; h.gear[k]++; h.sal=Math.max(h.sal,salaryFor(h)-2); hist(h,`reçoit : ${GEARN[k][h.gear[k]]}.`); save();},
  facil:d=>{const k=d.k; const c=FACIL[k].cost[S.fac[k]]; if(!c||S.gold<c)return; S.gold-=c; S.fac[k]++; news(`${pg().name} agrandit sa ${FACIL[k].n.toLowerCase()}.`,"me"); save();},
  endseason:()=>{endSeason(); UI.modal={type:"season"};},
  stage:d=>{S.pending.stage=d.s; save();},
  ct:d=>{const c=S.pending.contracts.find(x=>x.id===+d.id); const h=hero(c.id);
    if(d.k==="ok"){h.sal=c.ask;h.contract=2;c.state="signed";hist(h,`renouvelle pour 2 ans à ${c.ask} or/semaine.`);}
    else if(d.k==="leave"){c.state="leave";}
    else {const p=h.morale>60?.75:h.morale>35?.5:.25; if(chance(p)){c.ask=Math.round(c.ask*0.85); h.sal=c.ask; h.contract=2; c.state="signed"; toast(`${h.name} accepte ${c.ask} or/semaine.`); hist(h,`accepte une baisse et renouvelle à ${c.ask} or.`);} else {c.state="leave"; toast(`${h.name} se vexe et refuse de signer.`);}}
    save();},
  newseason:()=>{startNewSeason(); UI.modal=null; UI.tab="guilde";},
  copychron:()=>{copy(chronicleText(),"Annales copiées.");},
  export:()=>{copy(exportCode(),"Code de sauvegarde copié.");},
  import:()=>{if(S.ironman)return; const v=$("#imp").value; try{S=importCode(v); ensure(); save(); UI.tab="guilde"; toast("Partie chargée.");}catch(e){toast("Ce code n'est pas une sauvegarde valide.");}},
  askreset:()=>{UI.modal={type:"reset"};},
  doreset:()=>{try{localStorage.removeItem(SAVE_KEY);}catch(e){} S=null; UI={tab:"guilde",div:null,replay:null,modal:null,setup:{step:0},sel:[]};},
  theme:d=>{if(d.k)document.documentElement.setAttribute("data-theme",d.k); else document.documentElement.removeAttribute("data-theme"); try{localStorage.setItem("jd_theme",d.k);}catch(e){}},
  focus:()=>{},
  music:()=>{toggleMusic();},
  quest:d=>{const q=S.questOffers.find(x=>x.id===+d.q); if(!q)return; const sel=$("#q-"+q.id); const h=hero(+(sel&&sel.value)); if(!available(h)){toast("Choisissez un héros disponible.");return;} startQuest(h,q); save(); toast(`${h.name} part en quête.`);},
  buy:d=>{const i=S.market.findIndex(x=>x.id===+d.id); const h=S.market[i]; if(!h||S.gold<h.price||S.heroes.length>=10)return; const from=G(h.from); S.gold-=h.price; S.market.splice(i,1); delete h.price; delete h.from; h.joined=S.year; h.contract=2; h.morale=65; S.heroes.push(h); hist(h,`rejoint ${pg().name}, transféré${ag(h,"","e")} depuis ${from.name}.`); chron("join",`${h.name} arrive de ${from.name}.`,h.id); news(`${h.name} quitte ${from.name} pour ${pg().name}.`,"me"); if(S.lineup.length<4)S.lineup.push(h.id); save(); toast(`${h.name} rejoint la guilde.`);},
  offer:d=>{const o=S.offers.find(x=>x.id===+d.id); if(!o)return; const h=hero(o.hid); if(d.k==="ok"&&h){S.gold+=o.price; leaveGuild(h,`vente pour ${o.price} or`,o.gid); toast(`${h.name} est vendu${ag(h,"","e")}.`);} S.offers=S.offers.filter(x=>x!==o); save();}
};
function readSetup(){const st=UI.setup; const n=$("#g-name"),t=$("#g-town"),s=$("#g-seed"),i=$("#g-iron"); if(n)st.name=n.value; if(t)st.town=t.value; if(s)st.seed=s.value; if(i)st.iron=!!i.checked;}
function copy(text,msg){
  const done=()=>toast(msg);
  try{navigator.clipboard.writeText(text).then(done,()=>fallbackCopy(text,msg));}catch(e){fallbackCopy(text,msg);}
}
function fallbackCopy(text,msg){
  UI.modal=null; const root=$("#modal-root");
  root.innerHTML=`<div class="overlay"><div class="modal"><h2>Copier à la main</h2><p class="small">Le navigateur bloque la copie automatique. Sélectionnez le texte et copiez-le.</p><textarea id="cp" rows="10" style="width:100%">${esc(text)}</textarea><div><button data-a="closemodal">Fermer</button></div></div></div>`;
  const t=$("#cp"); t.focus(); t.select();
}

if(typeof document!=="undefined"){
  document.addEventListener("click",e=>{
    const el=e.target.closest("[data-a]"); if(!el)return;
    if(el.dataset.self&&e.target!==el)return;
    const fn=A[el.dataset.a]; if(!fn)return;
    const r=fn(el.dataset); if(r!=="norender")render();
  });
  document.addEventListener("keydown",e=>{
    if((e.key==="Enter"||e.key===" ")&&e.target.matches("[role=button][data-a]")){e.preventDefault(); e.target.click();}
    if(e.key==="Escape"&&UI.modal&&UI.modal.type!=="season"){UI.modal=null;render();}
  });
  document.addEventListener("change",e=>{if(e.target.id==="focus"){S.focus=e.target.value;save();}});
  try{const th=localStorage.getItem("jd_theme"); if(th)document.documentElement.setAttribute("data-theme",th);}catch(e){}
  UI.setup={step:0};
  render();
}
</script>

</body>
</html>
